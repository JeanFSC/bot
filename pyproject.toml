[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5-demo-trading-bot"
version = "0.1.0"
description = "Demo-first MetaTrader 5 bot using M1 EMA crossover with tick-aware execution checks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "MetaTrader5>=5.0.45",
    "mcp>=1.0",
    "pandas>=2.2",
    "numpy>=2.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mt5-mcp = "mt5_bot.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest_tmp"
