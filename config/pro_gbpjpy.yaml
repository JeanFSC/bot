# --- PRO GBPJPY - El par más volátil y rentable por ATR -----------------------
# GBPJPY tiene el ATR más alto de todos los pares principales.
# En tendencia fuerte puede mover 100-200 pips en M15. Solo sesión London
# donde el volumen es suficiente para absorber los grandes spreads.
# Magic: 260443 | DB: data/pro_gbpjpy.sqlite
# -----------------------------------------------------------------------------

symbol:           GBPJPY
timeframe:        M15
trend_timeframe:  H1
poll_seconds:     15
demo_only:        true

max_spread_pips:      3.5
max_open_positions:   1
max_daily_loss_pct:   5.0
max_trades_per_day:   20
use_global_risk_guard:  true
max_total_margin_pct: 85.0
max_portfolio_open_positions: 5
max_same_currency_positions: 2
cooldown_seconds:     45

use_partial_close:    true
partial_close_ratio:  0.5
profit_target_usd:    null
baseline_equity:      102000.0

database_path: data/pro_gbpjpy.sqlite

use_news_filter:      true
news_minutes_before:  45
news_minutes_after:   20

use_equity_curve_filter:  true
max_consecutive_losses:   3
lot_reduction_factor:     0.5

risk:
  mode:       percent_equity
  risk_pct:   1.8
  fixed_lot:  0.1
  sl_pips:    40
  tp_pips:    80

strategy:
  fast_ema: 13
  slow_ema: 34
  trend_ema:        50
  use_trend_filter: true

  rsi_period:    14
  rsi_buy_max:   65
  rsi_sell_min:  35
  use_rsi_filter: true
  use_rsi_momentum: false

  atr_period:    14
  min_atr_pips:  5.0
  use_atr_filter: true

  adx_period:    14
  adx_min_value: 25
  use_adx_filter: true

  atr_sl_multiplier: 1.5
  atr_tp_multiplier: 3.0
  use_atr_sl_tp: true

  session_start_hour: 7
  session_end_hour:   20
  use_session_filter: true

  use_trailing_stop:          true
  breakeven_atr_multiplier:   0.8
  trailing_atr_multiplier:    2.0

  use_retest_filter: false
  use_candle_confirm: true
  use_volatility_regime: true

execution:
  magic:        260443
  deviation:    30
  filling_mode: AUTO
  trade_enabled: false
