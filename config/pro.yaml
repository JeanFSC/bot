# --- PRO SCALPER - Multi-timeframe trend-following ---------------------------
#
#  Architecture:
#    Trend layer  -> H1 EMA(50): defines macro direction (bullish / bearish)
#    Signal layer -> M15 EMA(9/21) crossover aligned with H1 trend
#    Confirmation -> RSI(14) < 65 for buys, > 35 for sells (not overbought/oversold)
#    Volatility   -> ATR(14) > 1.5 pips (skip dead markets)
#    SL / TP      -> Dynamic: 1.5x ATR for SL, 2.5x ATR for TP (1:1.67 R:R)
#    Trailing stop-> Move SL to breakeven at 0.8x ATR profit; trail at 1.5x ATR
#    Session      -> London + NY only: 07:00-20:00 UTC
#
# CHANGES v2:
#   - ADX 22->18: captura early trends sin perder calidad de señal
#   - TP 4.0->2.5x ATR: mayor win rate, mas trades cierran con ganancia
# -----------------------------------------------------------------------------

symbol:           EURUSD
timeframe:        M15          # Entry signal timeframe
trend_timeframe:  H1           # Macro trend filter timeframe
poll_seconds:     15           # Re-check every 15s (M15 bars = 900s each)
demo_only:        true

# Risk limits
max_spread_pips:      1.8     # Only enter if spread <= 1.8 pips
max_open_positions:   1
max_daily_loss_pct:   5.0     # Stop trading after 5% daily drawdown
max_trades_per_day:   30      # Increased: more opportunities per day
use_global_risk_guard:  true
max_total_margin_pct: 85.0
max_portfolio_open_positions: 5
max_same_currency_positions: 2
cooldown_seconds:     30      # 30s cooldown
reverse_cooldown_seconds: 300
max_loss_per_symbol_per_hour_pct: 2.5

# -- News filter -- block entries near high-impact events (NFP, FOMC, CPI) ---
use_news_filter:      true
news_minutes_before:  30
news_minutes_after:   15

# -- Equity curve management -- reduce risk after losing streak ---------------
use_equity_curve_filter:  true
max_consecutive_losses:   3
lot_reduction_factor:     0.5

# -- Partial close at TP1 -----------------------------------------------------
use_partial_close:    true
partial_close_ratio:  0.5

profit_target_usd: null
baseline_equity: 102000.0

database_path: data/pro.sqlite

# -- Risk sizing -- percent equity para compounding automatico ----------------
risk:
  mode:       percent_equity
  risk_pct:   2.0
  fixed_lot:  0.5
  sl_pips:    20
  tp_pips:    40

# -- PRO strategy settings ----------------------------------------------------
strategy:
  # Entry EMAs (M15)
  fast_ema: 9
  slow_ema: 21

  # Higher-timeframe trend filter (H1)
  trend_ema:        50
  use_trend_filter: true       # EURUSD: mantener trend filter H1

  # RSI confirmation (M15)
  rsi_period:    14
  rsi_buy_max:   65
  rsi_sell_min:  35
  use_rsi_filter: true
  use_rsi_momentum: false

  # ATR volatility gate (M15)
  atr_period:    14
  min_atr_pips:  1.5
  use_atr_filter: true

  # ADX trend-strength gate
  adx_period:    14
  adx_min_value: 20
  use_adx_filter: true

  # Dynamic SL/TP based on ATR
  atr_sl_multiplier: 1.5       # SL = 1.5 x ATR
  atr_tp_multiplier: 3.0
  use_atr_sl_tp: true

  # Session filter
  session_start_hour: 7
  session_end_hour:   20
  use_session_filter: true

  # Trailing stop engine
  use_trailing_stop:          true
  breakeven_atr_multiplier:   0.8
  trailing_atr_multiplier:    1.5

  use_retest_filter: true
  retest_timeout_bars: 4
  use_volatility_regime: true

# -- Execution ----------------------------------------------------------------
execution:
  magic:        260433
  deviation:    20
  filling_mode: AUTO
  trade_enabled: false   # Sobreescrito por --trade-enabled en el .bat. NO cambiar a true aqui.
