# --- PRO GOLD M5 - XAUUSD 24h Agresivo ----------------------------------------
# Paralelo al bot M15, opera en M5 para capturar más señales en el activo más
# rentable. Sesión 24h (XAUUSD opera ~23h/día). Trend filter en M15 (no H1).
# Magic: 260440 | DB: data/pro_gold_m5.sqlite
# -----------------------------------------------------------------------------

symbol:           XAUUSD
timeframe:        M5
trend_timeframe:  M15
poll_seconds:     5
demo_only:        true

max_spread_pips:      35.0
max_open_positions:   1
max_daily_loss_pct:   5.0
max_trades_per_day:   40
use_global_risk_guard:  true
max_total_margin_pct: 85.0
max_portfolio_open_positions: 5
max_same_currency_positions: 2
cooldown_seconds:     20

use_partial_close:    true
partial_close_ratio:  0.5
profit_target_usd:    null
baseline_equity:      102000.0

database_path: data/pro_gold_m5.sqlite

use_news_filter:      true
news_minutes_before:  45
news_minutes_after:   20

use_equity_curve_filter:  true
max_consecutive_losses:   3
lot_reduction_factor:     0.5

risk:
  mode:       percent_equity
  risk_pct:   1.8
  fixed_lot:  0.01
  sl_pips:    150
  tp_pips:    400

strategy:
  fast_ema: 5
  slow_ema: 13
  trend_ema:        34
  use_trend_filter: true

  rsi_period:    14
  rsi_buy_max:   70
  rsi_sell_min:  30
  use_rsi_filter: true
  use_rsi_momentum: false

  atr_period:    14
  min_atr_pips:  100.0
  use_atr_filter: true

  adx_period:    14
  adx_min_value: 18
  use_adx_filter: true

  atr_sl_multiplier: 1.5
  atr_tp_multiplier: 3.0
  use_atr_sl_tp: true

  session_start_hour: 0
  session_end_hour:   24
  use_session_filter: true

  use_trailing_stop:          true
  breakeven_atr_multiplier:   0.8
  trailing_atr_multiplier:    2.0

  use_retest_filter: false

execution:
  magic:        260440
  deviation:    50
  filling_mode: AUTO
  trade_enabled: false
