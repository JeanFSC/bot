# --- PRO USDJPY ASIA - Cubre gap nocturno 20:00-07:00 UTC ---------------------
# Segundo bot USDJPY dedicado a sesión NY-cierre + Tokyo-apertura.
# Cubre el gap que el bot principal (07:00-20:00) deja sin cubrir.
# El par USDJPY es el más activo en horario asiático.
# Magic: 260445 | DB: data/pro_jpy_asia.sqlite
# -----------------------------------------------------------------------------

symbol:           USDJPY
timeframe:        M15
trend_timeframe:  M30
poll_seconds:     15
demo_only:        true

max_spread_pips:      1.5
max_open_positions:   1
max_daily_loss_pct:   5.0
max_trades_per_day:   30
use_global_risk_guard:  true
max_total_margin_pct: 85.0
max_portfolio_open_positions: 5
max_same_currency_positions: 2
cooldown_seconds:     30
reverse_cooldown_seconds: 600
max_loss_per_symbol_per_hour_pct: 2.0

use_partial_close:    true
partial_close_ratio:  0.5
profit_target_usd:    null
baseline_equity:      102000.0

database_path: data/pro_jpy_asia.sqlite

use_news_filter:      true
news_minutes_before:  30
news_minutes_after:   15

use_equity_curve_filter:  true
max_consecutive_losses:   3
lot_reduction_factor:     0.5

risk:
  mode:       percent_equity
  risk_pct:   1.5
  fixed_lot:  0.5
  sl_pips:    25
  tp_pips:    50

strategy:
  fast_ema: 9
  slow_ema: 21
  trend_ema:        50
  use_trend_filter: true

  rsi_period:    14
  rsi_buy_max:   70
  rsi_sell_min:  30
  use_rsi_filter: true
  use_rsi_momentum: false

  atr_period:    14
  min_atr_pips:  3.0
  use_atr_filter: true

  adx_period:    14
  adx_min_value: 24
  use_adx_filter: true

  atr_sl_multiplier: 1.5
  atr_tp_multiplier: 3.0
  use_atr_sl_tp: true

  session_start_hour: 20
  session_end_hour:   24
  use_session_filter: true
  session2_start_hour: 4
  session2_end_hour:   7
  use_session2:        true

  use_trailing_stop:          true
  breakeven_atr_multiplier:   0.8
  trailing_atr_multiplier:    1.5

  use_retest_filter: true
  retest_timeout_bars: 4
  use_volatility_regime: true

execution:
  magic:        260445
  deviation:    20
  filling_mode: AUTO
  trade_enabled: false
