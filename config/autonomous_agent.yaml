# Agente autonomo - MODO CONTINUO DEMO
# Bucle infinito con aprendizaje constante y guardrails duros.
# El agente opera sin detenerse hasta que toque floor_equity.

mode: demo
memory_db: data/autonomous_agent_memory.sqlite
max_parallel_bots: 1
max_seconds: 20
poll_seconds: 5
prioritize_live_positions: true

# Cuenta demo: equity aprox. 3000 USD
# Kill switch: si equity baja a este nivel, se detiene automaticamente.
floor_equity: 2900.0

# Perfil demo activo: mas mercados y rotacion mas rapida.
configs:
  - config/pro_usdchf.yaml
  - config/pro_audusd_m5_aggressive.yaml
  - config/pro_gbpjpy.yaml
  - config/pro_usdjpy_m5_safe.yaml
  - config/pro_eurusd_m5_aggressive.yaml
  - config/pro_gbp_m5_aggressive.yaml
  - config/pro_nzdusd_m5_aggressive.yaml
  - config/pro_usdcad.yaml

# HABILITADO para demo real con monitoreo.
allow_demo_orders: true

# Riesgo demo activo. Cada config mantiene sus propios caps y firewalls.
reduced_risk_pct: 0.35

