# Agente autonomo - MODO CONTINUO DEMO
# Bucle infinito con aprendizaje constante y guardrails duros.
# El agente opera sin detenerse hasta que toque floor_equity.

mode: demo
memory_db: data/autonomous_agent_memory.sqlite
max_parallel_bots: 1
max_seconds: 900
poll_seconds: 15

# Cuenta demo: equity aprox. 3000 USD
# Kill switch: si equity baja a este nivel, se detiene automaticamente.
floor_equity: 2900.0

# Solo set reducido, uno a la vez por seguridad.
configs:
  - config/pro_usdchf.yaml
  - config/pro_gold.yaml
  - config/pro_gbpjpy.yaml

# HABILITADO para demo real con monitoreo.
allow_demo_orders: true

# Riesgo base bajo para aprender sin quemar la cuenta.
reduced_risk_pct: 0.05
