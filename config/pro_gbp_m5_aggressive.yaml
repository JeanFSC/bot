# AGGRESSIVE M5 TEMPLATE - not auto-started. Use only after backtest/check.
# Goal: more entries without profit cap; winners still run via trailing/ATR TP.

symbol:           GBPUSD
timeframe:        M5
trend_timeframe:  H1
poll_seconds:     10
demo_only:        true

# Risk limits
max_spread_pips:      1.8     # GBPUSD spread ligeramente mayor que EURUSD
max_open_positions:   1
max_daily_loss_pct:   5.0
max_trades_per_day:   60
use_global_risk_guard:  true     # No cap a ganancias; solo bloquea nuevas entradas si la cuenta ya estÃ¡ muy cargada
max_total_margin_pct: 85.0     # Permite agresividad, evita stacking hasta margin call
max_portfolio_open_positions: 3
max_same_currency_positions: 2
cooldown_seconds:     15

profit_target_usd: null

database_path: data/pro_gbp_m5.sqlite

# Ã¢â€â‚¬Ã¢â€â‚¬ News filter Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬
use_news_filter:      true
news_minutes_before:  30
news_minutes_after:   15

# Ã¢â€â‚¬Ã¢â€â‚¬ Equity curve management Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬
use_equity_curve_filter:  true
max_consecutive_losses:   3
lot_reduction_factor:     0.5

# Ã¢â€â‚¬Ã¢â€â‚¬ Partial close at TP1 Ã¢â‚¬â€ NEW Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬
use_partial_close:    true
partial_close_ratio:  0.5

# Ã¢â€â‚¬Ã¢â€â‚¬ Risk sizing Ã¢â‚¬â€ percent equity para compounding automÃƒÂ¡tico Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬
risk:
  mode:       percent_equity
  risk_pct:   1.2              # 1.2% del equity por trade (+50% growth rate)
  fixed_lot:  0.5              # Fallback si percent_equity no aplica
  sl_pips:    25               # Pips para cÃƒÂ¡lculo de volumen (ATR override activo)
  tp_pips:    50               # Fallback

# Ã¢â€â‚¬Ã¢â€â‚¬ Strategy (mismos filtros pro, ajustados a volatilidad GBP) Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬
strategy:
  # Entry EMAs (M15)
  fast_ema: 5
  slow_ema: 13

  # Trend filter H1
  trend_ema:        50
  use_trend_filter: true

  # RSI confirmation
  rsi_period:    14
  rsi_buy_max:   72
  rsi_sell_min:  28
  use_rsi_filter: true
  use_rsi_momentum: false      # Disabled Ã¢â‚¬â€ RSI level filter already sufficient

  # ATR gate Ã¢â‚¬â€ GBPUSD ATR tÃƒÂ­pico 5Ã¢â‚¬â€œ15 pips, umbral 2.0 pips
  atr_period:    14
  min_atr_pips:  2.0           # Ligeramente mÃƒÂ¡s alto que EURUSD (GBP es mÃƒÂ¡s volÃƒÂ¡til)
  use_atr_filter: true

  # ADX trend-strength gate Ã¢â‚¬â€ NEW
  adx_period:    14
  adx_min_value: 18
  use_adx_filter: true

  # Dynamic SL/TP
  atr_sl_multiplier: 1.5
  atr_tp_multiplier: 4.0       # 1:2.7 R:R Ã¢â‚¬â€ trailing stop protege igualmente
  use_atr_sl_tp: true

  # Session
  session_start_hour: 7
  session_end_hour:   20
  use_session_filter: true

  # Trailing stop
  use_trailing_stop:          true
  breakeven_atr_multiplier:   0.7   # MÃƒÂ¡s agresivo Ã¢â‚¬â€ mover BE antes
  trailing_atr_multiplier:    1.2

  # Retest filter
  use_retest_filter: false

# Ã¢â€â‚¬Ã¢â€â‚¬ Execution Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬
execution:
