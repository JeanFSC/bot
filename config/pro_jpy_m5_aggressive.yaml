# AGGRESSIVE M5 TEMPLATE - not auto-started. Use only after backtest/check.
# Goal: more entries without profit cap; winners still run via trailing/ATR TP.

symbol:           USDJPY
timeframe:        M5          # Entry signal timeframe
trend_timeframe:  H1           # Macro trend filter timeframe
poll_seconds:     10
demo_only:        true

# Risk limits
max_spread_pips:      1.5     # USDJPY spread Ã¢â‚¬â€ ligeramente mayor que EURUSD
max_open_positions:   1
max_daily_loss_pct:   5.0
max_trades_per_day:   60
use_global_risk_guard:  true     # No cap a ganancias; solo bloquea nuevas entradas si la cuenta ya estÃ¡ muy cargada
max_total_margin_pct: 85.0     # Permite agresividad, evita stacking hasta margin call
max_portfolio_open_positions: 3
max_same_currency_positions: 2
cooldown_seconds:     15

# Ã¢â€â‚¬Ã¢â€â‚¬ Partial close at TP1 Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬
use_partial_close:    true
