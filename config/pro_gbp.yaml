# --- PRO GBP - GBPUSD Multi-timeframe trend-following ------------------------
#
#  Misma arquitectura que pro.yaml (EURUSD) pero para GBPUSD:
#    - Mayor volatilidad (ATR mas alto) -> SL/TP mas amplios mismo R:R
#    - Spread un poco mas amplio (hasta 1.8 pips)
#    - Magic 260434 (independiente del bot EURUSD)
#    - DB separada: data/pro_gbp.sqlite
#
# CHANGES v2:
#   - ADX 22->18: captura early trends
#   - TP 4.0->2.5x ATR: mayor win rate
# -----------------------------------------------------------------------------

symbol:           GBPUSD
timeframe:        M15
trend_timeframe:  H1
poll_seconds:     15
demo_only:        true

# Risk limits
max_spread_pips:      1.8
max_open_positions:   1
max_daily_loss_pct:   5.0
max_trades_per_day:   30
use_global_risk_guard:  true
max_total_margin_pct: 85.0
max_portfolio_open_positions: 5
max_same_currency_positions: 2
cooldown_seconds:     30

profit_target_usd: null
baseline_equity: 102000.0

database_path: data/pro_gbp.sqlite

# -- News filter --------------------------------------------------------------
use_news_filter:      true
news_minutes_before:  30
news_minutes_after:   15

# -- Equity curve management --------------------------------------------------
use_equity_curve_filter:  true
max_consecutive_losses:   3
lot_reduction_factor:     0.5

# -- Partial close ------------------------------------------------------------
use_partial_close:    true
partial_close_ratio:  0.5

# -- Risk sizing --------------------------------------------------------------
risk:
  mode:       percent_equity
  risk_pct:   1.8
  fixed_lot:  0.5
  sl_pips:    25
  tp_pips:    50

# -- Strategy -----------------------------------------------------------------
strategy:
  fast_ema: 9
  slow_ema: 21

  trend_ema:        50
  use_trend_filter: true       # GBPUSD: mantener trend filter H1

  rsi_period:    14
  rsi_buy_max:   65
  rsi_sell_min:  35
  use_rsi_filter: true
  use_rsi_momentum: false

  atr_period:    14
  min_atr_pips:  2.0
  use_atr_filter: true

  adx_period:    14
  adx_min_value: 20
  use_adx_filter: true

  atr_sl_multiplier: 1.5
  atr_tp_multiplier: 3.0
  use_atr_sl_tp: true

  session_start_hour: 7
  session_end_hour:   20
  use_session_filter: true

  use_trailing_stop:          true
  breakeven_atr_multiplier:   0.8
  trailing_atr_multiplier:    1.5

  use_retest_filter: true
  retest_timeout_bars: 4

# -- Execution ----------------------------------------------------------------
execution:
  magic:        260434
  deviation:    20
  filling_mode: AUTO
  trade_enabled: false   # Sobreescrito por --trade-enabled en el .bat. NO cambiar a true aqui.
