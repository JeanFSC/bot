# AGGRESSIVE M5 TEMPLATE - not auto-started. Use only after backtest/check.
# Goal: more entries without profit cap; winners still run via trailing/ATR TP.

symbol:           EURUSD
timeframe:        M5          # Entry signal timeframe
trend_timeframe:  H1           # Macro trend filter timeframe
poll_seconds:     10           # Re-check every 15s (M15 bars = 900s each)
demo_only:        true

# Risk limits
max_spread_pips:      1.8     # Only enter if spread Ã¢â€°Â¤ 1.8 pips
max_open_positions:   1
max_daily_loss_pct:   5.0     # Stop trading after 5% daily drawdown
max_trades_per_day:   60      # Increased: more opportunities per day
use_global_risk_guard:  true     # No cap a ganancias; solo bloquea nuevas entradas si la cuenta ya estÃ¡ muy cargada
max_total_margin_pct: 85.0     # Permite agresividad, evita stacking hasta margin call
max_portfolio_open_positions: 3
max_same_currency_positions: 2
cooldown_seconds:     15      # 30s cooldown Ã¢â‚¬â€ re-entry mÃƒÂ¡s rÃƒÂ¡pido

# Ã¢â€â‚¬Ã¢â€â‚¬ News filter Ã¢â‚¬â€ block entries near high-impact events (NFP, FOMC, CPI) Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬
use_news_filter:      true     # Bloquear entradas near high-impact news
news_minutes_before:  30       # Bloquear 30min antes del evento
news_minutes_after:   15       # Bloquear 15min despuÃƒÂ©s del evento

# Ã¢â€â‚¬Ã¢â€â‚¬ Equity curve management Ã¢â‚¬â€ reduce risk after losing streak Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬
use_equity_curve_filter:  true
max_consecutive_losses:   3    # Tras 3 pÃƒÂ©rdidas seguidas Ã¢â€ â€™ reducir lot
lot_reduction_factor:     0.5  # Reducir risk_pct al 50% durante racha perdedora

# Ã¢â€â‚¬Ã¢â€â‚¬ Partial close at TP1 Ã¢â‚¬â€ NEW Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬
# Close 50% of position when profit Ã¢â€°Â¥ 1Ãƒâ€”ATR (breakeven trigger).
# The remaining 50% stays open and is managed by the trailing stop.
# Net effect: fewer total losses, bigger average wins on strong moves.
use_partial_close:    true
partial_close_ratio:  0.5

# Profit target (USD) Ã¢â‚¬â€ optional safety net; ATR TP handles primary exit
profit_target_usd: null        # Disabled Ã¢â‚¬â€ rely on ATR TP + trailing stop

database_path: data/pro_eurusd_m5.sqlite

# Ã¢â€â‚¬Ã¢â€â‚¬ Risk sizing Ã¢â‚¬â€ percent equity para compounding automÃƒÂ¡tico Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬
# Con 1% del equity por trade: en $100k arriesgas $1000/trade.
# Cuando el account crece, los lots crecen proporcionalmente Ã¢â€ â€™ compounding real.
# sl_pips se usa para calcular el volumen (risk_pct / sl_pips). ATR SL/TP activo.
risk:
  mode:       percent_equity
  risk_pct:   1.5              # 1.5% del equity por trade (+50% growth rate)
  fixed_lot:  0.5              # Fallback si percent_equity no aplica
  sl_pips:    20               # Pips para cÃƒÂ¡lculo de volumen (ATR override activo)
  tp_pips:    40               # Fallback

# Ã¢â€â‚¬Ã¢â€â‚¬ PRO strategy settings Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬
strategy:
  # Entry EMAs (M15)
  fast_ema: 5
  slow_ema: 13

  # Higher-timeframe trend filter (H1)
  trend_ema:        50
  use_trend_filter: true       # Ã¢Ëœâ€¦ CRITICAL: only trade in macro direction

  # RSI confirmation (M15)
  rsi_period:    14
  rsi_buy_max:   72            # Don't buy when RSI > 65 (overbought)
  rsi_sell_min:  28            # Don't sell when RSI < 35 (oversold)
  use_rsi_filter: true
  use_rsi_momentum: false      # Disabled Ã¢â‚¬â€ RSI level filter already sufficient

  # ATR volatility gate (M15)
  atr_period:    14
  min_atr_pips:  1.5           # Skip if ATR < 1.5 pips
  use_atr_filter: true

  # ADX trend-strength gate Ã¢â‚¬â€ NEW
  #   ADX < threshold = ranging/consolidating market Ã¢â€ â€™ skip crossover (false signal)
  #   ADX > threshold = trending market Ã¢â€ â€™ valid crossover signal
  #   22 is more permissive than the textbook 25 (captures early trends)
  adx_period:    14
  adx_min_value: 18
  use_adx_filter: true

  # Dynamic SL/TP based on ATR
  atr_sl_multiplier: 1.5       # SL = 1.5 Ãƒâ€” ATR (adapts to volatility)
  atr_tp_multiplier: 4.0       # TP = 4.0 Ãƒâ€” ATR = 1:2.7 R:R Ã¢â‚¬â€ trailing stop protege igualmente
  use_atr_sl_tp: true

  # Session filter Ã¢â‚¬â€ London pre-open through NY close
  session_start_hour: 7        # 07:00 UTC
  session_end_hour:   20       # 20:00 UTC
  use_session_filter: true

  # Trailing stop engine
  use_trailing_stop:          true
  breakeven_atr_multiplier:   0.7   # Move SL to entry when profit Ã¢â€°Â¥ 0.8Ãƒâ€”ATR (mÃƒÂ¡s agresivo)
  trailing_atr_multiplier:    1.2   # Trail SL at 1.5Ãƒâ€”ATR behind price

  # Retest filter Ã¢â‚¬â€ espera pullback a slow EMA antes de entrar
  # Disabled: en M15 el pullback rara vez llega Ã¢â‚¬â€ se pierden todos los moves
  use_retest_filter: false

# Ã¢â€â‚¬Ã¢â€â‚¬ Execution Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬
execution:
  magic:        260533         # Unique magic for pro bot (separate from scalper)
  deviation:    20
  filling_mode: AUTO
  trade_enabled: false         # Activated by --trade-enabled in bat file


