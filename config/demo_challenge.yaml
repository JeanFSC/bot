# DEMO challenge mode. Objective: grow demo equity aggressively with hard stops.
# This is not for real-money trading.

symbol: EURUSD
timeframe: M1
poll_seconds: 2
tick_window_seconds: 30
demo_only: true
max_spread_pips: 2.5
max_open_positions: 1
max_daily_loss_pct: 25.0
max_trades_per_day: 250
cooldown_seconds: 5
database_path: data/demo_challenge.sqlite
baseline_equity: 3000.0

risk:
  mode: percent_equity
  fixed_lot: 0.1
  risk_pct: 2.0
  sl_pips: 10
  tp_pips: 15

strategy:
  fast_ema: 3
  slow_ema: 8
  rsi_period: 14
  rsi_buy_max: 78
  rsi_sell_min: 22
  atr_period: 14
  min_atr_pips: 0.3
  use_rsi_filter: false
  use_atr_filter: false

execution:
  magic: 260430
  deviation: 30
  filling_mode: AUTO
  trade_enabled: false
