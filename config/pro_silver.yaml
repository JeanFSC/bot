# --- PRO SILVER - XAGUSD 24h --------------------------------------------------
# Silver es más volátil que Gold y opera casi 24h.
# pip = 0.01 (igual que XAUUSD). ATR típico M15: 30-80 pips.
# Baja correlación con Forex → diversificación real del portafolio.
# Magic: 260444 | DB: data/pro_silver.sqlite
# NOTA: Verificar que XAGUSD esté disponible en tu MT5.
# -----------------------------------------------------------------------------

symbol:           XAGUSD
timeframe:        M15
trend_timeframe:  H1
poll_seconds:     15
demo_only:        true

max_spread_pips:      80.0
max_open_positions:   1
max_daily_loss_pct:   5.0
max_trades_per_day:   25
use_global_risk_guard:  true
max_total_margin_pct: 85.0
max_portfolio_open_positions: 5
max_same_currency_positions: 2
cooldown_seconds:     30

use_partial_close:    true
partial_close_ratio:  0.5
profit_target_usd:    null
baseline_equity:      102000.0

database_path: data/pro_silver.sqlite

use_news_filter:      true
news_minutes_before:  45
news_minutes_after:   20

use_equity_curve_filter:  true
max_consecutive_losses:   3
lot_reduction_factor:     0.5

risk:
  mode:       percent_equity
  risk_pct:   1.5
  fixed_lot:  0.1
  sl_pips:    100
  tp_pips:    250

strategy:
  fast_ema: 9
  slow_ema: 21
  trend_ema:        50
  use_trend_filter: true

  rsi_period:    14
  rsi_buy_max:   70
  rsi_sell_min:  30
  use_rsi_filter: true
  use_rsi_momentum: false

  atr_period:    14
  min_atr_pips:  20.0
  use_atr_filter: true

  adx_period:    14
  adx_min_value: 22
  use_adx_filter: true

  atr_sl_multiplier: 1.5
  atr_tp_multiplier: 3.0
  use_atr_sl_tp: true

  session_start_hour: 0
  session_end_hour:   24
  use_session_filter: true

  use_trailing_stop:          true
  breakeven_atr_multiplier:   0.8
  trailing_atr_multiplier:    2.0

  use_retest_filter: true
  retest_timeout_bars: 4
  use_volatility_regime: true

execution:
  magic:        260444
  deviation:    50
  filling_mode: AUTO
  trade_enabled: false
