symbol: USDJPY
timeframe: M5
trend_timeframe: H1
poll_seconds: 15
demo_only: true

# Research-only config. Do not add to live launchers until backtest and sandbox
# gates pass. Methodology is V2: London-session market-state/value-location
# candidate, not the old 24h EMA template.

max_spread_pips: 1.8
max_open_positions: 1
max_daily_loss_pct: 0.5
max_trades_per_day: 8
use_global_risk_guard: true
max_total_margin_pct: 50.0
max_portfolio_open_positions: 3
max_same_currency_positions: 1
max_same_direction_theme_positions: 1
cooldown_seconds: 300
reverse_cooldown_seconds: 900
max_loss_per_symbol_per_hour_pct: 0.25
use_news_filter: true
news_minutes_before: 30
news_minutes_after: 15
use_equity_curve_filter: true
max_consecutive_losses: 1
max_symbol_consecutive_losses: 1
lot_reduction_factor: 0.5
use_partial_close: false
partial_close_ratio: 0.35
profit_target_usd: null
baseline_equity: 102000.0
database_path: data/research_usdjpy_london_v2.sqlite

risk:
  mode: percent_equity
  risk_pct: 0.15
  fixed_lot: 0.1
  sl_pips: 10
  tp_pips: 20

strategy:
  fast_ema: 5
  slow_ema: 13
  trend_ema: 50
  use_trend_filter: true
  rsi_period: 14
  rsi_buy_max: 70
  rsi_sell_min: 30
  use_rsi_filter: true
  use_rsi_momentum: false
  atr_period: 14
  min_atr_pips: 2.0
  use_atr_filter: true
  adx_period: 14
  adx_min_value: 22
  use_adx_filter: true
  atr_sl_multiplier: 1.2
  atr_tp_multiplier: 2.4
  use_atr_sl_tp: true
  session_start_hour: 7
  session_end_hour: 12
  use_session_filter: true
  session2_start_hour: 0
  session2_end_hour: 0
  use_session2: false
  use_trailing_stop: false
  breakeven_atr_multiplier: 1.0
  trailing_atr_multiplier: 1.5
  use_retest_filter: true
  retest_timeout_bars: 4
  use_candle_confirm: true

execution:
  magic: 260545
  deviation: 20
  filling_mode: AUTO
  trade_enabled: false

max_trades_per_symbol_per_hour: 1
max_position_minutes: 60
time_stop_min_profit_pips: 0.0
risk_firewall_enabled: true
risk_firewall_tolerance: 1.10
max_order_volume: 0.0
max_symbol_daily_loss_pct: 0.25
max_symbol_weekly_loss_pct: 0.5
max_effective_risk_pct: 0.15
max_spread_to_sl_ratio: 0.18
min_sl_atr_ratio: 0.7
